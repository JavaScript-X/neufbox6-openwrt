<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Neufbox 6 hardware architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7a90"/>
    </marker>
    <style>
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#1b2a41}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#51627a;font-size:13px}
      .h{font-size:17px;font-weight:700}
      .l{stroke:#6b7a90;stroke-width:2;fill:none}
      .b{stroke-width:2;rx:14}
    </style>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#f6f8fb"/>
  <text x="40" y="52" class="t" font-size="26" font-weight="800">Neufbox 6 (NB6-SER-r0): what OpenWrt drives</text>

  <!-- SoC -->
  <rect x="440" y="230" width="320" height="190" class="b" fill="#e7efff" stroke="#3b6fd8"/>
  <text x="600" y="268" class="t h" text-anchor="middle">Broadcom BCM6362</text>
  <text x="600" y="292" class="s" text-anchor="middle">BMIPS4350 · 2 threads · 400 MHz</text>
  <text x="600" y="314" class="s" text-anchor="middle">64 MB DDR · bmips target · Linux 6.12</text>
  <rect x="470" y="334" width="120" height="66" rx="10" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="530" y="358" class="t" font-size="13" font-weight="700" text-anchor="middle">internal switch</text>
  <text x="530" y="378" class="s" text-anchor="middle">b53 DSA · port 4</text>
  <rect x="610" y="334" width="120" height="66" rx="10" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="670" y="358" class="t" font-size="13" font-weight="700" text-anchor="middle">WLAN core</text>
  <text x="670" y="378" class="s" text-anchor="middle">bcma → b43</text>

  <!-- Flash -->
  <rect x="440" y="80" width="320" height="100" class="b" fill="#fff4e5" stroke="#e08a1e"/>
  <text x="600" y="110" class="t h" text-anchor="middle">16 MB SPI NOR (MX25L12845E)</text>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">
    <rect x="460" y="124" width="40" height="36" fill="#e08a1e"/><text x="480" y="147" fill="#fff" text-anchor="middle">CFE</text>
    <rect x="500" y="124" width="200" height="36" fill="#f5c27a"/><text x="600" y="147" fill="#4a2f05" text-anchor="middle">firmware: tag · kernel · squashfs · jffs2</text>
    <rect x="700" y="124" width="40" height="36" fill="#e08a1e"/><text x="720" y="147" fill="#fff" text-anchor="middle">nvram</text>
  </g>
  <path d="M600 180V230" class="l" marker-end="url(#arr)"/>
  <text x="610" y="210" class="s">HS-SPI</text>

  <!-- RTL8367R -->
  <rect x="60" y="250" width="300" height="150" class="b" fill="#eafaf0" stroke="#2e9e5b"/>
  <text x="210" y="282" class="t h" text-anchor="middle">Realtek RTL8367R</text>
  <text x="210" y="304" class="s" text-anchor="middle">gigabit switch · swconfig · SMI on GPIO 18/20</text>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">
    <rect x="80" y="324" width="56" height="52" rx="8" fill="#ffd9a6" stroke="#e08a1e"/><text x="108" y="346" fill="#4a2f05" font-weight="700">0</text><text x="108" y="364" fill="#4a2f05">Fibre/WAN</text>
    <rect x="142" y="324" width="44" height="52" rx="8" fill="#ffffff" stroke="#2e9e5b"/><text x="164" y="356" fill="#1b2a41">1</text>
    <rect x="190" y="324" width="44" height="52" rx="8" fill="#ffffff" stroke="#2e9e5b"/><text x="212" y="356" fill="#1b2a41">2</text>
    <rect x="238" y="324" width="44" height="52" rx="8" fill="#ffffff" stroke="#2e9e5b"/><text x="260" y="356" fill="#1b2a41">3</text>
    <rect x="286" y="324" width="44" height="52" rx="8" fill="#ffffff" stroke="#2e9e5b"/><text x="308" y="356" fill="#1b2a41">4</text>
  </g>
  <text x="236" y="392" class="s" text-anchor="middle">LAN 1-4</text>
  <path d="M360 367H470" class="l" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="405" y="358" class="s" text-anchor="middle">RGMII 1G</text>
  <text x="405" y="386" class="s" text-anchor="middle">VLAN 1 / 2</text>
  <text x="210" y="418" class="s" text-anchor="middle">→ extsw.1 (LAN) · extsw.2 (WAN)</text>

  <!-- Wi-Fi -->
  <rect x="840" y="250" width="300" height="130" class="b" fill="#eef6ff" stroke="#2b8bd6"/>
  <text x="990" y="282" class="t h" text-anchor="middle">2.4 GHz radio 2057 rev 8</text>
  <text x="990" y="304" class="s" text-anchor="middle">N-PHY rev 8 · corerev 22 · AP + WPA2</text>
  <text x="990" y="326" class="s" text-anchor="middle">firmware ucode22_mimo · SPROM from SFR</text>
  <text x="990" y="350" class="s" text-anchor="middle">no 5 GHz on this board</text>
  <path d="M730 367H840" class="l" marker-end="url(#arr)"/>

  <!-- MCU -->
  <rect x="440" y="480" width="320" height="120" class="b" fill="#fff0f2" stroke="#d6374a"/>
  <text x="600" y="512" class="t h" text-anchor="middle">SFR microcontroller @ I²C 0x60</text>
  <text x="600" y="534" class="s" text-anchor="middle">i2c-gpio SDA 30 / SCL 2 · nb6-hwmon driver</text>
  <text x="600" y="556" class="s" text-anchor="middle">9 PWM LEDs · temperature · voltage · watchdog</text>
  <g transform="translate(520 568)">
    <circle cx="0" cy="12" r="8" fill="#3ddc84"/><circle cx="26" cy="12" r="8" fill="#ffa630"/><circle cx="52" cy="12" r="8" fill="#ff4d5e"/>
    <circle cx="96" cy="12" r="7" fill="#fff" stroke="#9aa7ba"/><circle cx="120" cy="12" r="7" fill="#fff" stroke="#9aa7ba"/><circle cx="144" cy="12" r="7" fill="#fff" stroke="#9aa7ba"/>
  </g>
  <path d="M600 420V480" class="l" marker-end="url(#arr)"/>

  <!-- Buttons -->
  <rect x="60" y="470" width="300" height="130" class="b" fill="#f3f0ff" stroke="#7a5bd6"/>
  <text x="210" y="502" class="t h" text-anchor="middle">Buttons (gpio-keys)</text>
  <text x="210" y="526" class="s" text-anchor="middle">SFR 10 · ECO 16 · Wi-Fi switch 12</text>
  <text x="210" y="548" class="s" text-anchor="middle">WPS 25 · Reset 24 (active low)</text>
  <text x="210" y="570" class="s" text-anchor="middle">→ /etc/rc.button/*</text>
  <path d="M360 535H410V440H470V422" class="l" marker-end="url(#arr)"/>

  <!-- USB / serial -->
  <rect x="840" y="470" width="300" height="130" class="b" fill="#f2f4f7" stroke="#6b7a90"/>
  <text x="990" y="502" class="t h" text-anchor="middle">USB 2.0 · serial console</text>
  <text x="990" y="526" class="s" text-anchor="middle">EHCI/OHCI (USB storage, Wi-Fi dongle)</text>
  <text x="990" y="548" class="s" text-anchor="middle">UART 115200 8N1 · GND TX RX 3.3 V</text>
  <text x="990" y="570" class="s" text-anchor="middle">used to flash from CFE</text>
  <path d="M840 535H790V440H730V422" class="l" marker-end="url(#arr)"/>
</svg>
