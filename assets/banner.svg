<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="neufbox6-openwrt: OpenWrt 25.12 on the SFR Neufbox 6">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#14284a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ee"/>
    </linearGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#3ddc84" stop-opacity=".9"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowO"><stop offset="0" stop-color="#ffa630" stop-opacity=".9"/><stop offset="1" stop-color="#ffa630" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".9"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- Neufbox 6 -->
  <g transform="translate(870 60)">
    <ellipse cx="160" cy="318" rx="170" ry="16" fill="#000" opacity=".35"/>
    <rect x="40" y="0" width="240" height="300" rx="28" fill="url(#box)"/>
    <rect x="40" y="0" width="240" height="300" rx="28" fill="none" stroke="#b8c2d1" stroke-width="2"/>
    <!-- top LEDs a b c -->
    <circle cx="110" cy="48" r="30" fill="url(#glowG)"/>
    <circle cx="160" cy="48" r="30" fill="url(#glowO)"/>
    <circle cx="210" cy="48" r="30" fill="url(#glowR)"/>
    <circle cx="110" cy="48" r="9" fill="#3ddc84"/>
    <circle cx="160" cy="48" r="9" fill="#ffa630"/>
    <circle cx="210" cy="48" r="9" fill="#ff4d5e"/>
    <text x="110" y="82" fill="#5b6b82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">a</text>
    <text x="160" y="82" fill="#5b6b82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">b</text>
    <text x="210" y="82" fill="#5b6b82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">c</text>
    <!-- buttons -->
    <rect x="86" y="104" width="48" height="18" rx="9" fill="#e4002b"/>
    <text x="110" y="117" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SFR</text>
    <rect x="186" y="104" width="48" height="18" rx="9" fill="#2e9e5b"/>
    <text x="210" y="117" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ECO</text>
    <!-- wifi switch -->
    <rect x="130" y="146" width="60" height="16" rx="8" fill="#c9d1dd"/>
    <circle cx="170" cy="154" r="10" fill="#7a8aa3"/>
    <text x="160" y="180" fill="#5b6b82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Wi-Fi · WPS</text>
    <!-- front white LEDs -->
    <g fill="#ffffff" stroke="#9aa7ba">
      <circle cx="120" cy="240" r="6"/><circle cx="160" cy="240" r="6"/><circle cx="200" cy="240" r="6"/>
    </g>
    <g fill="#5b6b82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">
      <text x="120" y="262">wan</text><text x="160" y="262">voip</text><text x="200" y="262">wlan</text>
    </g>
    <!-- wifi waves -->
    <g fill="none" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" opacity=".9">
      <path d="M290 40 a40 40 0 0 1 0 56"/>
      <path d="M306 24 a62 62 0 0 1 0 88"/>
      <path d="M322 8 a84 84 0 0 1 0 120"/>
    </g>
  </g>

  <!-- Title -->
  <text x="64" y="118" fill="#7cc4ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">UNOFFICIAL OPENWRT PORT</text>
  <text x="62" y="186" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800">neufbox6-openwrt</text>
  <text x="64" y="232" fill="#c8d4e6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">OpenWrt 25.12 · Linux 6.12 on the white SFR Neufbox 6</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(64 272)">
      <rect width="196" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="98" y="26" fill="#e6eefc" text-anchor="middle">📶 Integrated Wi-Fi</text>
    </g>
    <g transform="translate(276 272)">
      <rect width="176" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="88" y="26" fill="#e6eefc" text-anchor="middle">💡 Front LEDs</text>
    </g>
    <g transform="translate(468 272)">
      <rect width="196" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="98" y="26" fill="#e6eefc" text-anchor="middle">🔌 Gigabit switch</text>
    </g>
    <g transform="translate(64 324)">
      <rect width="196" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="98" y="26" fill="#e6eefc" text-anchor="middle">🔒 WireGuard VPN</text>
    </g>
    <g transform="translate(276 324)">
      <rect width="176" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="88" y="26" fill="#e6eefc" text-anchor="middle">🛠️ BCM6362</text>
    </g>
    <g transform="translate(468 324)">
      <rect width="196" height="40" rx="20" fill="#1f3a66" stroke="#3a5d96"/>
      <text x="98" y="26" fill="#e6eefc" text-anchor="middle">♻️ Saved from e-waste</text>
    </g>
  </g>
</svg>
