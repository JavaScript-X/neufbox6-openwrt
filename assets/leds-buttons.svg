<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="LEDs and buttons">
  <defs>
    <style>
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#1b2a41}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#51627a;font-size:14px}
      .h{font-size:17px;font-weight:700}
    </style>
    <radialGradient id="g"><stop offset="0" stop-color="#3ddc84" stop-opacity=".8"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
    <radialGradient id="o"><stop offset="0" stop-color="#ffa630" stop-opacity=".8"/><stop offset="1" stop-color="#ffa630" stop-opacity="0"/></radialGradient>
    <radialGradient id="r"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".8"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="560" rx="20" fill="#f6f8fb"/>
  <text x="40" y="52" class="t" font-size="26" font-weight="800">LEDs and buttons</text>

  <!-- box top view -->
  <g transform="translate(60 90)">
    <rect width="300" height="420" rx="30" fill="#ffffff" stroke="#b8c2d1" stroke-width="2"/>
    <circle cx="90" cy="70" r="34" fill="url(#g)"/><circle cx="150" cy="70" r="34" fill="url(#o)"/><circle cx="210" cy="70" r="34" fill="url(#r)"/>
    <circle cx="90" cy="70" r="11" fill="#3ddc84"/><circle cx="150" cy="70" r="11" fill="#ffa630"/><circle cx="210" cy="70" r="11" fill="#ff4d5e"/>
    <g class="t" font-size="15" font-weight="700" text-anchor="middle"><text x="90" y="118">a</text><text x="150" y="118">b</text><text x="210" y="118">c</text></g>
    <rect x="60" y="150" width="72" height="28" rx="14" fill="#e4002b"/><text x="96" y="169" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">SFR</text>
    <rect x="168" y="150" width="72" height="28" rx="14" fill="#2e9e5b"/><text x="204" y="169" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">ECO</text>
    <rect x="100" y="216" width="100" height="24" rx="12" fill="#d5dce7"/><circle cx="168" cy="228" r="14" fill="#7a8aa3"/>
    <text x="150" y="266" class="s" text-anchor="middle">Wi-Fi switch → push = WPS</text>
    <g fill="#ffffff" stroke="#9aa7ba" stroke-width="2"><circle cx="90" cy="330" r="9"/><circle cx="150" cy="330" r="9"/><circle cx="210" cy="330" r="9"/></g>
    <g class="s" text-anchor="middle"><text x="90" y="362">wan</text><text x="150" y="362">voip</text><text x="210" y="362">wlan</text></g>
  </g>

  <!-- legend -->
  <g transform="translate(420 92)">
    <text class="t h" y="0">Top LEDs (red + green = orange)</text>
    <g transform="translate(0 22)">
      <rect width="720" height="44" rx="10" fill="#ffffff" stroke="#d7dee8"/>
      <text x="16" y="28" class="t" font-size="15" font-weight="700">a · Internet</text>
      <circle cx="180" cy="22" r="8" fill="#3ddc84"/><text x="194" y="27" class="s">online</text>
      <circle cx="280" cy="22" r="8" fill="#ffa630"/><text x="294" y="27" class="s">WAN up, no internet</text>
      <circle cx="470" cy="22" r="8" fill="#ff4d5e"/><text x="484" y="27" class="s">WAN cable unplugged</text>
    </g>
    <g transform="translate(0 74)">
      <rect width="720" height="44" rx="10" fill="#ffffff" stroke="#d7dee8"/>
      <text x="16" y="28" class="t" font-size="15" font-weight="700">b · VPN</text>
      <circle cx="180" cy="22" r="8" fill="#3ddc84"/><text x="194" y="27" class="s">tunnel up</text>
      <circle cx="280" cy="22" r="8" fill="#ffa630"/><text x="294" y="27" class="s">blinking: connecting</text>
      <circle cx="470" cy="22" r="8" fill="#c9d1dd"/><text x="484" y="27" class="s">off: VPN down</text>
    </g>
    <g transform="translate(0 126)">
      <rect width="720" height="44" rx="10" fill="#ffffff" stroke="#d7dee8"/>
      <text x="16" y="28" class="t" font-size="15" font-weight="700">c · Health</text>
      <circle cx="180" cy="22" r="8" fill="#3ddc84"/><text x="194" y="27" class="s">all good</text>
      <circle cx="280" cy="22" r="8" fill="#ffa630"/><text x="294" y="27" class="s">hot or low memory</text>
      <circle cx="470" cy="22" r="8" fill="#ff4d5e"/><text x="484" y="27" class="s">blinking: service down</text>
    </g>

    <text class="t h" y="222">White LEDs</text>
    <text class="s" y="248">wan / wlan blink with WAN / Wi-Fi traffic · voip blinks 60 s when a new device joins the LAN</text>

    <text class="t h" y="296">Buttons</text>
    <g class="s">
      <text y="324"><tspan font-weight="700" fill="#e4002b">SFR</tspan>  → LED spiral: a/b/c rotate green → orange → red (press again to stop)</text>
      <text y="352"><tspan font-weight="700" fill="#2e9e5b">ECO</tspan>  → VPN on / off (WireGuard interface "vpn")</text>
      <text y="380"><tspan font-weight="700">Wi-Fi switch</tspan>  → radio on / off · pushed further → WPS pairing for 2 minutes</text>
      <text y="408"><tspan font-weight="700">Reset</tspan> (rear)  → short: reboot · long: factory reset</text>
    </g>
  </g>
</svg>
