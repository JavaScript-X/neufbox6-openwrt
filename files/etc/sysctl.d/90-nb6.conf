# SFR Neufbox 6: 54 MB of RAM with zram swap.
# Prefer moving idle program memory to the (fast, compressed) zram swap over dropping the file
# cache: otherwise LuCI's files are evicted and re-read from the xz-compressed squashfs on every
# page, which costs 1-2 s on the 400 MHz CPU.
vm.swappiness=100
vm.vfs_cache_pressure=50
